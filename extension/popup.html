<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --ink: #0c2430;
      --muted: #586a72;
      --pill-bg: #f5f5f5;
      --pill-border: #c2d0d6;
      --btn-bg: #fafafa;
      --btn-border: #c2d0d6;
      --surface: #ffffff;
      --on-bg: #e8413a;
      --on-ink: #ffffff;
      --off-bg: #eef2f3;
      --off-ink: #51646b;
      --paused-bg: #f6e7c8;
      --paused-ink: #6b5417;
      --accent: #00b0b0;
      --ok-ink: #1f6b35;
      --warn-ink: #8a5a1f;
      --warn-bg: #fff3e2;
    }
    body[data-theme="dark"] {
      --ink: #e7f3f5;
      --muted: #9fb5bb;
      --pill-bg: #1a2a31;
      --pill-border: #2a4954;
      --btn-bg: #172a32;
      --btn-border: #2a4954;
      --surface: #0f1f25;
      --on-bg: #c5362f;
      --on-ink: #fff;
      --off-bg: #16262d;
      --off-ink: #9fb5bb;
      --paused-bg: #3a2c1b;
      --paused-ink: #ffd6a6;
      --accent: #35d5d5;
      --ok-ink: #9fe0b5;
      --warn-ink: #ffd6a6;
      --warn-bg: #3a2c1b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      margin: 0;
      width: 290px;
      color: var(--ink);
      background: var(--surface);
    }
    .wrap { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .statusCard {
      border-radius: 16px;
      padding: 18px 14px 16px;
      text-align: center;
      background: var(--off-bg);
      color: var(--off-ink);
      border: 1px solid var(--btn-border);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .statusCard.on { background: var(--on-bg); color: var(--on-ink); border-color: transparent; }
    .statusCard.paused { background: var(--paused-bg); color: var(--paused-ink); border-color: transparent; }
    .statusBig { font-size: 22px; font-weight: 800; letter-spacing: 0.4px; }
    .statusSub { font-size: 13px; margin-top: 4px; opacity: 0.92; }
    .muted { color: var(--muted); font-size: 12px; }
    .health { font-size: 12px; line-height: 1.4; padding: 0 2px; }
    .health:empty { display: none; }
    .health.ok { color: var(--ok-ink); }
    .health.warn { color: var(--warn-ink); background: var(--warn-bg); border-radius: 10px; padding: 7px 10px; }
    .health a { color: var(--accent); cursor: pointer; text-decoration: underline; }
    /* Actions: pause controls side by side, Settings full width below —
       all the same button. */
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pauseRow { display: contents; }
    .actions .wide { grid-column: 1 / -1; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    button svg { width: 15px; height: 15px; flex: none; }
    button {
      height: 34px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
    }
    button:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(0, 64, 80, 0.12); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .buildBadge {
      display: none;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px dashed var(--btn-border);
      background: var(--pill-bg);
      color: var(--muted);
      font-size: 11px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="statusCard off" id="status_card">
      <div class="statusBig" id="status_big">Off air</div>
      <div class="statusSub" id="status_sub">No meeting detected</div>
    </div>

    <div class="health muted" id="health" role="status"></div>

    <div class="actions">
      <div class="pauseRow" id="pause_row"></div>
      <button type="button" class="wide" id="openOptions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </div>

    <div class="muted" id="icon_hint" style="display:none;">Grayscale icon = OFF. Color icon = ON.</div>
    <div class="buildBadge" id="build_badge" title="Unpacked dev build — git branch @ commit"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
