<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --ink: #0c2430;
      --muted: #586a72;
      --pill-bg: #f5f5f5;
      --pill-border: #c2d0d6;
      --pill-on-bg: #e9ffff;
      --pill-on-border: #0aa;
      --btn-bg: #fafafa;
      --btn-border: #c2d0d6;
      --surface: #ffffff;
    }
    body[data-theme="dark"] {
      --ink: #e7f3f5;
      --muted: #9fb5bb;
      --pill-bg: #1a2a31;
      --pill-border: #2a4954;
      --pill-on-bg: #193a42;
      --pill-on-border: #35d5d5;
      --btn-bg: #172a32;
      --btn-border: #2a4954;
      --surface: #0f1f25;
    }
    body {
      font-family: system-ui, sans-serif;
      margin: 12px;
      min-width: 280px;
      color: var(--ink);
      background: var(--surface);
    }
    .row { display:flex; justify-content:space-between; align-items:center; margin: 8px 0; }
    .pill { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--pill-border); background: var(--pill-bg); }
    .on { background: var(--pill-on-bg); border-color: var(--pill-on-border); }
    .off { background: var(--pill-bg); }
    .muted { color: var(--muted); font-size: 12px; margin-top: 8px; }
    button { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--ink); cursor: pointer; }
    .buildBadge {
      display: none;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px dashed var(--btn-border);
      background: var(--pill-bg);
      color: var(--muted);
      font-size: 11px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="row">
    <div><b>ON-AIR</b></div>
    <div id="state" class="pill off">OFF</div>
  </div>
  <div class="row">
    <div>Service</div>
    <div id="service" class="muted">—</div>
  </div>
  <div class="row">
    <button id="openOptions">Settings</button>
    <button id="refresh">Refresh</button>
  </div>
  <div class="muted" id="icon_hint" style="display:none;">Grayscale icon = OFF. Color icon = ON.</div>
  <div class="buildBadge" id="build_badge" title="Unpacked dev build — git branch @ commit"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
