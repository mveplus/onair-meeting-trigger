name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"     # e.g. v0.1.2
          VER="${TAG#v}"               # -> 0.1.2

          python3 - <<PY
          import json, sys
          from pathlib import Path

          ver = "$VER"
          p = Path("extension/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          mv = data.get("version")

          if mv != ver:
              print(f"ERROR: tag v{ver} != manifest.json version {mv}", file=sys.stderr)
              sys.exit(1)

          print(f"OK: manifest.json version = {ver}")
          PY

      - name: Build extension zip
        run: |
          chmod +x scripts/build-zip.sh
          scripts/build-zip.sh

      - name: Replace existing release if one is already there
        # softprops/action-gh-release fails with "Cannot upload assets to
        # an immutable release" when a published release already exists
        # for the tag (e.g. after re-running the workflow on the same
        # tag). Delete it first so the next step can recreate it cleanly.
        # The tag itself is left intact.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Found existing release for $GITHUB_REF_NAME, deleting so the next step can recreate it."
            gh release delete "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --yes
          else
            echo "No existing release for $GITHUB_REF_NAME, nothing to delete."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist.zip
          generate_release_notes: true

      - name: Upload to Chrome Web Store (draft)
        # Uploads dist.zip as a draft — it does NOT publish; submit for
        # review by hand in the developer console. If the previous version
        # is still in review or approved-but-unpublished, the store refuses
        # uploads: the script then skips with a warning (the release stays
        # green) and the run summary points to the manual
        # "Upload to Chrome Web Store" workflow (cws-upload.yml).
        #
        # Required GitHub Secrets (Settings → Secrets and variables →
        # Actions):
        #   CWS_CLIENT_ID      — OAuth Desktop client ID
        #   CWS_CLIENT_SECRET  — OAuth Desktop client secret
        #   CWS_REFRESH_TOKEN  — long-lived refresh token captured once
        #   CWS_PUBLISHER_ID   — publisher id from the developer console
        #   CWS_EXTENSION_ID   — the 32-char id from the CWS URL
        env:
          CLIENT_ID:     ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID:  ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID:  ${{ secrets.CWS_EXTENSION_ID }}
        run: scripts/cws-upload.sh dist.zip
