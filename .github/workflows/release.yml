name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"     # e.g. v0.1.2
          VER="${TAG#v}"               # -> 0.1.2

          python3 - <<PY
          import json, sys
          from pathlib import Path

          ver = "$VER"
          p = Path("extension/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          mv = data.get("version")

          if mv != ver:
              print(f"ERROR: tag v{ver} != manifest.json version {mv}", file=sys.stderr)
              sys.exit(1)

          print(f"OK: manifest.json version = {ver}")
          PY

      - name: Build extension zip
        run: |
          chmod +x scripts/build-zip.sh
          scripts/build-zip.sh

      - name: Replace existing release if one is already there
        # softprops/action-gh-release fails with "Cannot upload assets to
        # an immutable release" when a published release already exists
        # for the tag (e.g. after re-running the workflow on the same
        # tag). Delete it first so the next step can recreate it cleanly.
        # The tag itself is left intact.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Found existing release for $GITHUB_REF_NAME, deleting so the next step can recreate it."
            gh release delete "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --yes
          else
            echo "No existing release for $GITHUB_REF_NAME, nothing to delete."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist.zip
          generate_release_notes: true

      - name: Upload to Chrome Web Store (draft)
        # Pushes the freshly-built dist.zip to the existing extension in
        # the Chrome Web Store dev console as a draft version. It does
        # NOT publish — the maintainer reviews the draft in the dev
        # console and clicks "Submit for review" by hand. That keeps
        # control over what reaches Google's review queue while still
        # automating the upload itself.
        #
        # Required GitHub Secrets (Settings → Secrets and variables →
        # Actions):
        #   CWS_CLIENT_ID      — OAuth Desktop client ID
        #   CWS_CLIENT_SECRET  — OAuth Desktop client secret
        #   CWS_REFRESH_TOKEN  — long-lived refresh token captured once
        #   CWS_EXTENSION_ID   — the 32-char id from the CWS URL
        env:
          CLIENT_ID:     ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID:  ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail

          # 1) Exchange the refresh token for a short-lived access token.
          #    jq is preinstalled on GitHub-hosted ubuntu runners.
          ACCESS_TOKEN="$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token \
            | jq -r '.access_token // empty')"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to obtain access token from Google OAuth"
            echo "::error::Check CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN are set and current."
            exit 1
          fi

          # 2) PUT the new ZIP against the existing extension. Replaces
          #    any previous unsubmitted draft.
          RESPONSE="$(curl -fsS -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -T dist.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")"

          echo "$RESPONSE"

          STATUS="$(echo "$RESPONSE" | jq -r '.uploadState // empty')"
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "::error::CWS upload reported uploadState=$STATUS"
            echo "$RESPONSE" | jq -r '.itemError[]?.error_detail // .itemError[]?.error_code // empty'
            exit 1
          fi

          echo ""
          echo "✓ Uploaded ${GITHUB_REF_NAME} as a draft."
          echo "  Review at https://chrome.google.com/webstore/devconsole"
          echo "  and click 'Submit for review' when the listing diff looks right."

